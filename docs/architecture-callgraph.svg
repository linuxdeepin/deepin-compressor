<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1640" viewBox="0 0 1620 1640" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<style>
 .t{font-size:15px;font-weight:600;fill:#0f172a}
 .s{font-size:12px;fill:#475569}
 .x{font-size:11.5px;fill:#64748b}
 .src{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
 .api{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}
 .plg{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.5}
 .e{stroke:#2563eb;stroke-width:1.6;fill:none}
 .ed{stroke:#dc2626;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
 .num{font-size:13px;font-weight:700;fill:#fff}
 .layer{font-size:10.5px;font-weight:700;letter-spacing:.4px}
 .tag{font-size:11px;fill:#334155}
</style>
<rect x="0" y="0" width="1620" height="1560" fill="#ffffff"/>
<text x="34" y="38" class="t" font-size="19">deepin-compressor 调用时序（从 main 开始）</text>
<text x="34" y="62" class="s">一个框 = 一步；编号严格自上而下读。左列标注该步属于哪一层。</text>
<text x="34" y="82" class="s">蓝 = src 自有　紫 = 3rdparty/interface（契约层）　绿 = 插件 .so（运行时加载）</text>
<rect x="290" y="128" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="152" text-anchor="middle" class="t">main()</text>
<text x="650.0" y="172" text-anchor="middle" class="s">MLogger → 解析 argv → 构造 DApplication</text>
<circle cx="70" cy="150.0" r="15" fill="#475569"/>
<text x="70" y="155.0" text-anchor="middle" class="num">1</text>
<rect x="96" y="144.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="160.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="210" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="234" text-anchor="middle" class="t">CompressorApplication（DApplication）</text>
<text x="650.0" y="254" text-anchor="middle" class="s">翻译 / 图标 / 单实例 / DBus 适配器</text>
<circle cx="70" cy="232.0" r="15" fill="#475569"/>
<text x="70" y="237.0" text-anchor="middle" class="num">2</text>
<rect x="96" y="226.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="242.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="292" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="316" text-anchor="middle" class="t">MainWindow</text>
<text x="650.0" y="336" text-anchor="middle" class="s">slotHandleArguments → loadArchive / extract / compress</text>
<circle cx="70" cy="314.0" r="15" fill="#475569"/>
<text x="70" y="319.0" text-anchor="middle" class="num">3</text>
<rect x="96" y="308.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="324.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="374" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="398" text-anchor="middle" class="t">ArchiveManager::loadArchive(path)</text>
<text x="650.0" y="418" text-anchor="middle" class="s">单例；判断操作种类，准备参数</text>
<circle cx="70" cy="396.0" r="15" fill="#475569"/>
<text x="70" y="401.0" text-anchor="middle" class="num">4</text>
<rect x="96" y="390.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="406.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="456" width="720" height="64" rx="9" class="src"/>
<text x="650.0" y="480" text-anchor="middle" class="t">UiTools::createInterface(path, false)</text>
<text x="650.0" y="500" text-anchor="middle" class="s">按 MIME + 业务指定的 eType（APT_Libzip / APT_Cli7z …）选后端</text>
<circle cx="70" cy="482.0" r="15" fill="#475569"/>
<text x="70" y="487.0" text-anchor="middle" class="num">5</text>
<rect x="96" y="476.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="492.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="546" width="720" height="64" rx="9" class="api"/>
<text x="650.0" y="570" text-anchor="middle" class="t">PluginManager::preferredPluginsFor(mime)</text>
<text x="650.0" y="590" text-anchor="middle" class="s">按 X-KDE-Priority 排序，再用 Name 子串过滤（7zip / libzip / pzip …）</text>
<circle cx="70" cy="572.0" r="15" fill="#475569"/>
<text x="70" y="577.0" text-anchor="middle" class="num">6</text>
<rect x="96" y="566.0" width="4" height="24" rx="2" fill="#7c3aed"/>
<text x="108" y="582.0" class="layer" fill="#7c3aed">3rdparty/interface</text>
<rect x="290" y="636" width="720" height="64" rx="9" class="api"/>
<text x="650.0" y="660" text-anchor="middle" class="t">KPluginLoader：扫目录 + 读元数据</text>
<text x="650.0" y="680" text-anchor="middle" class="s">/usr/lib/deepin-compressor/plugins/*.so 内嵌的 kerfuffle_*.json</text>
<circle cx="70" cy="662.0" r="15" fill="#475569"/>
<text x="70" y="667.0" text-anchor="middle" class="num">7</text>
<rect x="96" y="656.0" width="4" height="24" rx="2" fill="#7c3aed"/>
<text x="108" y="672.0" class="layer" fill="#7c3aed">3rdparty/interface</text>
<rect x="290" y="726" width="720" height="64" rx="9" class="plg"/>
<text x="650.0" y="750" text-anchor="middle" class="t">KPluginFactory::create() → 插件实例（dlopen）</text>
<text x="650.0" y="770" text-anchor="middle" class="s">构造参数 { 压缩包路径, 插件元数据, CustomMimeType }</text>
<circle cx="70" cy="752.0" r="15" fill="#475569"/>
<text x="70" y="757.0" text-anchor="middle" class="num">8</text>
<rect x="96" y="746.0" width="4" height="24" rx="2" fill="#0f766e"/>
<text x="108" y="762.0" class="layer" fill="#0f766e">3rdparty/插件</text>
<rect x="290" y="816" width="720" height="56" rx="9" class="api"/>
<text x="650.0" y="840" text-anchor="middle" class="t">返回 ReadOnlyArchiveInterface*</text>
<text x="650.0" y="860" text-anchor="middle" class="s">从这一刻起 src 只认这个指针，不再关心背后是哪个实现</text>
<circle cx="70" cy="838.0" r="15" fill="#475569"/>
<text x="70" y="843.0" text-anchor="middle" class="num">9</text>
<rect x="96" y="832.0" width="4" height="24" rx="2" fill="#7c3aed"/>
<text x="108" y="848.0" class="layer" fill="#7c3aed">3rdparty/interface</text>
<rect x="290" y="898" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="922" text-anchor="middle" class="t">new LoadJob(iface) → start()</text>
<text x="650.0" y="942" text-anchor="middle" class="s">若 waitForFinished()==true 直接执行，否则起 SingleJobThread</text>
<circle cx="70" cy="920.0" r="15" fill="#475569"/>
<text x="70" y="925.0" text-anchor="middle" class="num">10</text>
<rect x="96" y="914.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="930.0" class="layer" fill="#2563eb">src 自有</text>
<rect x="290" y="980" width="720" height="64" rx="9" class="api"/>
<text x="650.0" y="1004" text-anchor="middle" class="t">iface->list()（虚函数分派）</text>
<text x="650.0" y="1024" text-anchor="middle" class="s">契约方法：list / testArchive / extractFiles / addFiles / deleteFiles …</text>
<circle cx="70" cy="1006.0" r="15" fill="#475569"/>
<text x="70" y="1011.0" text-anchor="middle" class="num">11</text>
<rect x="96" y="1000.0" width="4" height="24" rx="2" fill="#7c3aed"/>
<text x="108" y="1016.0" class="layer" fill="#7c3aed">3rdparty/interface</text>
<rect x="290" y="1070" width="720" height="140" rx="9" class="plg"/>
<text x="314" y="1094" class="t">插件实现执行</text>
<text x="314" y="1122" class="tag" font-weight="700">库调用</text>
<text x="430" y="1122" class="x">libarchiveplugin → libarchive C API　·　libzipplugin → libzip C API　·　minizip</text>
<text x="314" y="1149" class="tag" font-weight="700">命令行子进程</text>
<text x="430" y="1149" class="x">CliInterface → QProcess / KPTY　·　7z　·　unrar　·　tar + pigz</text>
<text x="314" y="1176" class="tag" font-weight="700">外部可执行</text>
<text x="430" y="1176" class="x">clipzipplugin → /usr/lib/deepin-compressor/pzip（--ui-events 推进度）</text>
<circle cx="70" cy="1134.0" r="15" fill="#475569"/>
<text x="70" y="1139.0" text-anchor="middle" class="num">12</text>
<rect x="96" y="1128.0" width="4" height="24" rx="2" fill="#0f766e"/>
<text x="108" y="1144.0" class="layer" fill="#0f766e">3rdparty/插件</text>
<rect x="290" y="1236" width="720" height="104" rx="9" class="api"/>
<text x="314" y="1260" class="t">数据与交互回传</text>
<text x="314" y="1286" class="tag" font-weight="700">DataManager</text>
<text x="440" y="1286" class="x">list() 把条目写进全局单例；UI 从这里读（src 里 18 处）</text>
<text x="314" y="1310" class="tag" font-weight="700">Query 对话框</text>
<text x="440" y="1310" class="x">密码 / 覆盖 / 损坏包：emit signalQuery → 主线程弹框 → setResponse 唤醒工作线程</text>
<text x="314" y="1334" class="tag" font-weight="700">信号</text>
<text x="440" y="1334" class="x">signalprogress / signalCurFileName / signalFinished / signalCancel</text>
<circle cx="70" cy="1282.0" r="15" fill="#475569"/>
<text x="70" y="1287.0" text-anchor="middle" class="num">13</text>
<rect x="96" y="1276.0" width="4" height="24" rx="2" fill="#7c3aed"/>
<text x="108" y="1292.0" class="layer" fill="#7c3aed">3rdparty/interface</text>
<rect x="290" y="1366" width="720" height="56" rx="9" class="src"/>
<text x="650.0" y="1390" text-anchor="middle" class="t">Job 收尾 → UI 刷新</text>
<text x="650.0" y="1410" text-anchor="middle" class="s">signalFinished 结束 Job；progress 刷新进度条；DataManager 供树模型读取</text>
<circle cx="70" cy="1388.0" r="15" fill="#475569"/>
<text x="70" y="1393.0" text-anchor="middle" class="num">14</text>
<rect x="96" y="1382.0" width="4" height="24" rx="2" fill="#2563eb"/>
<text x="108" y="1398.0" class="layer" fill="#2563eb">src 自有</text>
<path d="M 650.0,184 L 650.0,210" class="e" marker-end="url(#a)"/>
<path d="M 650.0,266 L 650.0,292" class="e" marker-end="url(#a)"/>
<path d="M 650.0,348 L 650.0,374" class="e" marker-end="url(#a)"/>
<text x="660.0" y="365" class="x">调用</text>
<path d="M 650.0,430 L 650.0,456" class="e" marker-end="url(#a)"/>
<path d="M 650.0,520 L 650.0,546" class="e" marker-end="url(#a)"/>
<path d="M 650.0,610 L 650.0,636" class="e" marker-end="url(#a)"/>
<text x="660.0" y="627" class="x">调用</text>
<path d="M 650.0,700 L 650.0,726" class="e" marker-end="url(#a)"/>
<path d="M 650.0,790 L 650.0,816" class="e" marker-end="url(#a)"/>
<path d="M 650.0,872 L 650.0,898" class="e" marker-end="url(#a)"/>
<path d="M 650.0,954 L 650.0,980" class="e" marker-end="url(#a)"/>
<path d="M 650.0,1044 L 650.0,1070" class="e" marker-end="url(#a)"/>
<path d="M 650.0,1210 L 650.0,1236" class="e" marker-end="url(#a)"/>
<path d="M 650.0,1340 L 650.0,1366" class="e" marker-end="url(#a)"/>
<path d="M 1010,844.0 L 1064,844.0 L 1064,928 L 1010,928" class="ed" marker-end="url(#ad)"/>
<text x="1070" y="834.0" class="x" fill="#dc2626">返回值</text>
<text x="1034" y="400" class="x">整个流程在此分岔：先拿后端，</text>
<text x="1034" y="417" class="x">再交给 Job；两步顺序固定。</text>
<text x="1034" y="482" class="x">eType 是业务硬编码策略：zip 注释</text>
<text x="1034" y="499" class="x">固定 libzip；分卷 zip / tar.7z 固定 cli7z。</text>
<text x="1034" y="662" class="x">扫目录只得到候选；能否启用还看</text>
<text x="1034" y="679" class="x">.so 声明的外部命令在不在。</text>
<text x="1034" y="1006" class="x">同步或异步由后端自己决定，src 只是</text>
<text x="1034" y="1023" class="x">照 waitForFinished() 的返回值执行。</text>
<rect x="34" y="1452" width="1552" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="54" y="1476" class="t" font-size="13.5">结构上的三个事实</text>
<text x="54" y="1499" class="s">· src 的可执行文件只链接 compressor-interface 一个库；libarchive / libzip / minizip 只出现在插件 .so 的链接行里。</text>
<text x="54" y="1518" class="s">· src 从不 include 插件头、不实例化插件类；第 9 步之后它手里只有一个 ReadOnlyArchiveInterface*。</text>
<text x="54" y="1537" class="s">· 8 个后端都链接同一个 compressor-interface，接口类在进程内只有一份，靠虚函数分派到具体实现。</text>
</svg>
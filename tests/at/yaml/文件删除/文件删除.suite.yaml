name: 文件删除_suite
app: deepin-compressor
module: 文件删除
setup:
- action: session_start
  command: deepin-compressor
  wait: 3.0
suites:
- id: suite_文件删除_001_s1
  name: 解压列表删除所有文件
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: ExtractButton
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: BackButton
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ExtractButton
      role: push button
teardown:
- action: session_stop

name: 右键菜单_suite
app: deepin-compressor
module: 右键菜单
setup:
- action: session_start
  command: deepin-compressor
  wait: 3.0
suites:
- id: suite_右键菜单_001_s1
  name: 子目录添加文件
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: SelectFileButton
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ExtractButton
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: CompressButton
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SelectFileButton
      role: push button
teardown:
- action: session_stop

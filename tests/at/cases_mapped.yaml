version: '1.0'
cases:
- id: suite_yasuoshezhi_001_s1
  name: 压缩设置-压缩类型标签显示当前压缩类型
  module: 压缩设置
  steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: ClickTypeLabel
      role: label
  - step_type: assert
    action: assert_process_running
    app: deepin-compressor
- id: suite_duihuakuang_001_s1
  name: 对话框-应用到所有复选框勾选应用到所有
  module: 对话框
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Applyall_btn
      role: check box
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: Applyall_btn
      role: check box
  - step_type: assert
    action: assert_process_running
    app: deepin-compressor
